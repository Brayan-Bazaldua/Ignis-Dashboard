services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ignis-db
    environment:
      POSTGRES_USER: ignis
      POSTGRES_PASSWORD: ignis
      POSTGRES_DB: ignis
    ports:
      - "5433:5432"
    volumes:
      - ignis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignis -d ignis"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ignis_pgdata:
