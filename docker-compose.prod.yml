services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ignis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ignis}
      POSTGRES_DB: ${POSTGRES_DB:-ignis}
    volumes:
      - ignis_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ignis} -d ${POSTGRES_DB:-ignis}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Solo accesible desde la propia VM para depuracion.
    ports:
      - "127.0.0.1:5433:5432"

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ignis:ignis@db:5432/ignis}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    volumes:
      - ./data:/app/data:ro
    command: >
      sh -c "python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  ignis_pgdata_prod:
